<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>보배에프앤비 업무 대시보드</title>
<style>
/* ── 장부(ledger) — 숫자를 읽는 문서. 인주 붉은색은 '위험'에만 쓴다 ──
   색을 아껴야 경고가 눈에 들어온다. 나머지는 전부 먹과 종이. */
:root {
  color-scheme: light dark;
  --seal:  #b3332a;   /* 인주 — 위험 */
  --brass: #8a6410;   /* 주의 */
  --jade:  #2c6553;   /* 양호 */
  --ink:    #151b19;  /* 먹 — 청록 쪽으로 살짝 기울인 검정 */
  --ink-2:  #46534f;
  --ink-3:  #77837f;
  --paper:  #f6f8f7;  /* 종이 — 같은 방향으로 기울인 흰색 */
  --surface:#ffffff;
  --rule:   #d9e0dd;
  --rule-2: #eaefed;
  --stripe: var(--rule);
}
@media (prefers-color-scheme: dark) {
  :root {
    --seal:  #e8746a;
    --brass: #d3a53c;
    --jade:  #6fbfa4;
    --ink:    #e8eeec;
    --ink-2:  #b3c0bc;
    --ink-3:  #7f8d89;
    --paper:  #101413;
    --surface:#171d1b;
    --rule:   #2a3532;
    --rule-2: #202927;
  }
}
:root[data-theme="dark"] {
  --seal:#e8746a; --brass:#d3a53c; --jade:#6fbfa4;
  --ink:#e8eeec; --ink-2:#b3c0bc; --ink-3:#7f8d89;
  --paper:#101413; --surface:#171d1b; --rule:#2a3532; --rule-2:#202927;
}
:root[data-theme="light"] {
  --seal:#b3332a; --brass:#8a6410; --jade:#2c6553;
  --ink:#151b19; --ink-2:#46534f; --ink-3:#77837f;
  --paper:#f6f8f7; --surface:#ffffff; --rule:#d9e0dd; --rule-2:#eaefed;
}

/* 한글 웹폰트는 용량이 커서 페이지에 심을 수 없다(외부 로딩은 차단됨).
   그래서 시스템 서체를 쓰되, 숫자는 등폭으로 자릿수를 맞춘다. */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
.mono, .num, .row-value, .stamp b {
  font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 72px; }

/* ── 표제 ── */
.masthead {
  display: grid; gap: 14px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--ink);
}
.eyebrow {
  margin: 0;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-3);
}
.masthead h1 {
  margin: 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.15;
  letter-spacing: -0.02em; text-wrap: balance;
}
.mast-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
.verdict {
  font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 2px;
}
.verdict.bad  { background: var(--seal);  color: var(--surface); }
.verdict.warn { background: var(--brass); color: var(--surface); }
.verdict.good { background: var(--jade);  color: var(--surface); }
.stamp {
  margin: 0; font-size: 12px; color: var(--ink-2);
  display: flex; flex-wrap: wrap; gap: 4px 14px;
}
.stamp b { font-weight: 600; color: var(--ink); }

/* ── 절 ── */
section { margin-top: 40px; }
section > h2 {
  margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em;
  padding-bottom: 8px; border-bottom: 1px solid var(--ink);
}
.lede { margin: 10px 0 16px; color: var(--ink-2); font-size: 13.5px; max-width: 66ch; }

/* ── 지표 행 ── */
.rows { display: grid; gap: 1px; background: var(--rule-2); border: 1px solid var(--rule); }
.row { background: var(--surface); padding: 14px 16px 14px 20px; position: relative; }
.row::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--stripe);
}
.row.t-bad  { --stripe: var(--seal); }
.row.t-warn { --stripe: var(--brass); }
.row.t-good { --stripe: var(--jade); }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.row-label { font-size: 13.5px; color: var(--ink-2); }
.row-value { margin-left: auto; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.row.t-bad .row-value  { color: var(--seal); }
.row.t-warn .row-value { color: var(--brass); }
.row.t-good .row-value { color: var(--jade); }

.row-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
.row-meta dt {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); padding-top: 3px;
}
.row-meta dd { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

/* ── 상태 알약 ── */
.pill {
  font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 2px;
  border: 1px solid currentColor; white-space: nowrap;
}
.p-bad  { color: var(--seal); }
.p-warn { color: var(--brass); }
.p-good { color: var(--jade); }
.p-flat { color: var(--ink-3); }

/* ── 폐점 ── */
.cl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.cl-list > li {
  background: var(--surface); border: 1px solid var(--rule);
  border-left: 4px solid var(--seal); padding: 13px 16px;
}
.cl-list > li.cl-missing { border-left-color: var(--brass); }
.cl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 10px; }
.cl-head b { font-size: 15px; }
.cl-when { margin-left: auto; font-size: 12px; color: var(--ink-2); }
.cl-follow { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.cl-src {
  margin: 8px 0 0; padding-left: 11px; border-left: 2px solid var(--rule);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.6;
}
.cl-from { margin: 5px 0 0; font-size: 11px; color: var(--ink-3); }

/* ── 표 ── */
.table-scroll { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
thead th {
  text-align: left; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
  font-family: ui-monospace, Consolas, monospace; color: var(--ink-3); font-weight: 600;
  padding: 9px 14px; border-bottom: 1px solid var(--ink);
}
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-name { font-weight: 600; white-space: nowrap; }
.tm-doing { color: var(--ink-2); }
.miss { color: var(--seal); font-weight: 600; }

/* ── 외부 신호 ── */
.nw-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.nw-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13.5px; }
.nw-when {
  flex: none; min-width: 52px; font-family: ui-monospace, Consolas, monospace;
  font-size: 11px; color: var(--ink-3);
}
.nw-list a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
.nw-list a:hover { border-bottom-color: var(--seal); }
.nw-src { font-size: 11px; color: var(--ink-3); }

/* ── 경영전략 — 번호가 곧 우선순위다 ── */
.st-list { list-style: none; counter-reset: st; margin: 0; padding: 0; display: grid; gap: 14px; }
.st-list > li {
  counter-increment: st;
  background: var(--surface); border: 1px solid var(--rule);
  padding: 15px 18px 15px 56px; position: relative;
}
.st-list > li::before {
  content: counter(st);
  position: absolute; left: 18px; top: 15px;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 20px; font-weight: 700; color: var(--seal); line-height: 1;
}
.st-list h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: -0.01em; }
.st-list p { margin: 0; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
.st-list strong { color: var(--ink); }
.st-basis { margin-top: 9px !important; font-size: 11.5px !important; color: var(--ink-3) !important; }
.st-basis span {
  font-family: ui-monospace, Consolas, monospace; font-size: 9.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 1px 6px; border: 1px solid var(--rule); margin-right: 6px;
}

/* ── 결재 (서버 없이 기기에 저장) ── */
.dec-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin: 12px 0 0; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--rule);
}
#dec-count {
  font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--ink-2);
}
#dec-copy {
  margin-left: auto; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  padding: 7px 14px; border: 1px solid var(--ink); border-radius: 2px;
  background: var(--ink); color: var(--paper);
}
#dec-copy:hover { opacity: 0.85; }
.dec-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.dec {
  font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  padding: 6px 14px; border: 1px solid var(--rule); border-radius: 2px;
  background: var(--paper); color: var(--ink-2);
}
.dec:hover { border-color: var(--ink-3); color: var(--ink); }
.dec[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.dec-mark { font-size: 11px; color: var(--ink-3); margin-left: 4px; }
.pj-list > li.d-진행 { border-left: 4px solid var(--jade); }
.pj-list > li.d-수정보완 { border-left: 4px solid var(--brass); }
.pj-list > li.d-반려 { border-left: 4px solid var(--seal); opacity: 0.7; }

/* ── 가상 성과 ── */
.pj-group { margin-top: 22px; }
.pj-group > h3 { margin: 0 0 8px; font-size: 15px; }
.pj-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pj-list > li { background: var(--surface); border: 1px solid var(--rule); padding: 12px 15px; }
.pj-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.pj-head b { font-size: 14.5px; }
.pj-team { font-size: 11px; color: var(--ink-3); }
.pj-value { margin: 6px 0 0; font-size: 13.5px; font-weight: 600; }
.empty { color: var(--ink-3); font-size: 13px; }

.note {
  margin-top: 14px; padding: 12px 15px; background: var(--surface);
  border: 1px solid var(--rule); border-left: 4px solid var(--brass);
  font-size: 12.5px; color: var(--ink-2); line-height: 1.65;
}
footer {
  margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule);
  font-size: 11.5px; color: var(--ink-3); line-height: 1.7;
}
a:focus-visible, summary:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
@media (max-width: 620px) {
  .row-value { margin-left: 0; width: 100%; }
  .cl-when { margin-left: 0; }
}
</style>
<style>
.gate { max-width: 560px; margin: 12vh auto; padding: 0 20px; display: grid; gap: 18px; }
.gate h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
.gate p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
.gate .state {
  display: flex; align-items: center; gap: 9px;
  font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-3);
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.on { background: var(--jade); }
.dot.off { background: var(--seal); }
.gate .go {
  display: inline-block; padding: 12px 22px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--paper); text-decoration: none;
  font-weight: 700; font-size: 14.5px; border-radius: 2px; justify-self: start;
}
.gate .alt { font-size: 13px; }
.gate .alt a { color: var(--ink); }
.hidden { display: none; }
</style>
</head>
<body>
<div class="gate">
  <p class="eyebrow">주식회사 보배에프앤비 · 사내 한정</p>
  <h1>업무 대시보드</h1>

  <div class="state"><span class="dot" id="dot"></span><span id="msg">상태 확인 중…</span></div>
  <div id="body"></div>
  <p class="state" id="foot"></p>
</div>

<script>
/* ⚠️ 이 HTML 은 GitHub 이 10분간 캐시한다. 상태를 여기 박아두면 옛 판이 남아
      "닫혀 있다"고 잘못 보인다(실제로 그렇게 잘못 표시된 적이 있다).
      그래서 상태는 **같은 폴더의 state.json 을 캐시 무시하고 매번 새로 읽는다.**
      같은 도메인이라 CORS 문제가 없다.
   ⚠️ 대시보드에 직접 물어보는 건 불가능하다 — 개발서버(Vite)가 다른 도메인에서 오는
      요청을 Sec-Fetch/Origin 단계에서 403 으로 막아 fetch 도 <img> 도 통하지 않는다.
      그래서 감시기가 10분마다 확인한 결과를 state.json 에 적고, 여기서는 그걸 읽는다. */
(function () {
  var BRIEFING = "https://mi4814365-svg.github.io/bobae-briefing/";
  var dot = document.getElementById("dot"), msg = document.getElementById("msg");
  var body = document.getElementById("body"), foot = document.getElementById("foot");

  var show = function (s) {
    var open = Boolean(s && s.alive && s.target);
    dot.className = "dot " + (open ? "on" : "off");
    msg.textContent = (open ? "열려 있음" : "닫혀 있음") + (s && s.updatedAt ? " · " + s.updatedAt + " 확인" : "");
    foot.textContent = "상태는 10분마다 자동으로 다시 확인합니다.";

    if (open) {
      body.innerHTML =
        "<p>대시보드로 이동합니다. 안 넘어가면 아래를 눌러주세요.</p>" +
        '<p style="margin-top:14px;"><a class="go" href="' + s.target + '/?view=dashboard">대시보드 열기</a></p>';
      setTimeout(function () { location.replace(s.target + "/?view=dashboard"); }, 900);
      return;
    }

    var html =
      "<p><strong>지금은 대시보드가 닫혀 있습니다.</strong> 사내 PC 에서 운영되는 화면이라 업무시간 외에는 꺼져 있을 수 있습니다.</p>" +
      '<p class="alt">대신 <a href="' + BRIEFING + '">경영 브리핑</a>에서 오늘 지표·폐점 사유·경영전략·팀 현황을 보실 수 있습니다. 이쪽은 항상 열려 있습니다.</p>';
    if (s && s.lan) html += '<p class="alt">사무실 와이파이에서는 <a href="' + s.lan + '/?view=dashboard">' + s.lan + "</a> 로도 들어가실 수 있습니다.</p>";
    if (s && s.target) html += '<p class="alt">그래도 시도해보시려면 <a href="' + s.target + '/?view=dashboard">여기</a>를 누르세요.</p>';
    body.innerHTML = html;
  };

  fetch("state.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(show)
    .catch(function () { show(null); });
})();
</script>
</body>
</html>
